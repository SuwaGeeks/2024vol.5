version: '3.8'
services:
  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend
  
  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_PATH=/data/database.sqlite3
    depends_on:
      - db

  db:
    build:
      context: .
      dockerfile: ./db/Dockerfile
    volumes:
      - db-data:/data